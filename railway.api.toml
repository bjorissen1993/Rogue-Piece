# API service (api.roguepiece): set Config-as-code path to /railway.api.toml
# Default railway.toml deploys the frontend image instead.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
