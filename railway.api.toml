# API service only. Frontend service must use /railway.frontend.toml
# (Settings → Config-as-code), otherwise it will crash running this Docker image.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
