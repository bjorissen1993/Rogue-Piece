# Force API-only deploy (avoids Vite frontend + npm workspace issues).
# Dashboard: clear custom Build/Start commands so this file is used,
# or set Build Command / Start Command empty and builder = DOCKERFILE.

[build]
builder = "DOCKERFILE"
dockerfilePath = "server/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
