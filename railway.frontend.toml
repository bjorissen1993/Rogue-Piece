# Frontend (Vite) — set this service's Config-as-code path to /railway.frontend.toml
# so it does NOT use the root railway.toml Docker API image.

[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm run build"

[deploy]
startCommand = "npm run start:web"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
