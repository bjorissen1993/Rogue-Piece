# Prefer repo-root Dockerfile when deploying from GitHub without Root Directory.
# This file is for local `railway up` from ./server only.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
